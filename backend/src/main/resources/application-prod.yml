# Production profile for cloud deployment.
# Set secrets via environment variables (see deploy/env.example).
# Activate with: SPRING_PROFILES_ACTIVE=prod

server:
  # Bind to loopback only; expose 80/443 via Nginx reverse proxy.
  address: 127.0.0.1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/poker_db}
    username: ${DB_USERNAME:poker}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.poker: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
