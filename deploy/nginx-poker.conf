# Nginx site config for poker app.
# Install: sudo cp deploy/nginx-poker.conf /etc/nginx/sites-available/poker
#          sudo ln -s /etc/nginx/sites-available/poker /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP with the ECS public IP or domain name.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Frontend static files (npm run build output)
    root /opt/poker/frontend/build;
    index index.html;

    # API -> Spring Boot (prod binds 127.0.0.1:8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
